name: Release

on:
  push:
    branches: 
      - main
      - dev
      - dev-patch

jobs:
  # eavfw_test:
  #   uses: ./.github/workflows/testeavfw.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    # needs:
    #   - "eavfw_test"
    permissions:
      contents: write        # tags and GitHub releases
      issues: write          # release comments
      pull-requests: write   # release comments
      id-token: write        # npm trusted publishing (OIDC), no NPM_TOKEN
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        # trusted publishing needs npm >= 11.5.1, which ships with Node 24
        node-version: '24'

    - name: Add plugin for conventional commits
      run: npm install conventional-changelog-conventionalcommits --force
      working-directory: ./.github/workflows

    - name: NPM Install
      run: npm ci --force

    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GIT_AUTHOR_NAME: pksorensen
        GIT_AUTHOR_EMAIL: poul@kjeldager.com
      run: npm run release

